<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Intelligence | Error {{ error_code or 404 }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .error-card {
        max-width: 520px;
        width: 100%;
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        box-shadow: var(--card-shadow);
      }
      .error-code-badge {
        font-size: 3.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="container d-flex justify-content-center">
      <div class="card error-card p-4 text-center">
        <div class="card-body">
          <div class="error-code-badge mb-2">{{ error_code or 404 }}</div>
          <h3 class="fw-bold mb-3">{{ error_title or "Notice" }}</h3>
          <p class="text-secondary mb-4">
            {{ error_message or "The requested resource is currently unavailable." }}
          </p>
          <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('login') }}" class="btn btn-primary px-4 py-2 rounded-3 d-inline-flex align-items-center gap-2">
              <i class="bi bi-box-arrow-in-right"></i> Return to Portal
            </a>
            <button id="themeToggleBtn" onclick="toggleTheme()" class="btn btn-outline-secondary px-3 py-2 rounded-3">
              <i class="bi bi-moon-stars-fill"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
