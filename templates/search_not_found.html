<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Record Not Found</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .error-card {
        max-width: 520px;
        width: 100%;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
        background-color: #ffffff;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      }

      .icon-bg {
        width: 80px;
        height: 80px;
        background-color: #fee2e2;
        color: #ef4444;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        margin: 0 auto 20px auto;
        font-size: 2.25rem;
      }

      .btn-home {
        background-color: #4f46e5;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        padding: 0.75rem 1.75rem;
        transition: background-color 0.2s;
      }

      .btn-home:hover {
        background-color: #4338ca;
        color: #ffffff;
      }
    </style>
  </head>

  <body>
    <div class="container d-flex justify-content-center p-3">
      <div class="card error-card p-4 text-center">
        <div class="card-body">
          <div class="icon-bg">
            <i class="bi bi-search-heart"></i>
          </div>
          <h3 class="fw-bold mb-2 text-dark">No Student Match Found</h3>
          <p class="text-secondary mb-4">
            We couldn't locate any active student record matching <span class="fw-bold text-danger">"{{ query }}"</span>.
          </p>

          <div class="bg-light p-3 rounded-3 text-start small mb-4 border">
            <strong class="text-dark d-block mb-1"><i class="bi bi-lightbulb text-warning me-1"></i> Search Tips:</strong>
            <ul class="mb-0 ps-3 text-muted">
              <li>Enter exact or partial Roll Number (e.g. <code>IT2024001</code>)</li>
              <li>Search by full or partial student name (e.g. <code>Zeeshan</code>)</li>
              <li>Check for typos or extra trailing spaces</li>
            </ul>
          </div>

          <a href="/" class="btn btn-home text-decoration-none d-inline-flex align-items-center gap-2">
            <i class="bi bi-house-door-fill"></i> Return to Main Dashboard
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
