<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Intelligence | Student Not Found</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--body-bg);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .error-card {
        max-width: 520px;
        width: 100%;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        box-shadow: var(--card-shadow);
      }

      .icon-bg {
        width: 80px;
        height: 80px;
        background-color: rgba(239, 68, 68, 0.12);
        color: #ef4444;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        margin: 0 auto 20px auto;
        font-size: 2.25rem;
      }

      .btn-home {
        background-color: var(--primary);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        padding: 0.75rem 1.75rem;
        transition: background-color 0.2s;
      }

      .btn-home:hover {
        background-color: var(--primary-hover);
        color: #ffffff;
      }
    </style>
  </head>

  <body>
    <div class="container d-flex justify-content-center p-3 position-relative">
      <div class="card error-card p-4 text-center">
        <div class="card-body">
          <div class="icon-bg">
            <i class="bi bi-search"></i>
          </div>
          <h3 class="fw-bold mb-2">No Student Match Found</h3>
          <p class="text-secondary mb-4">
            We couldn't locate any active student record matching <span class="fw-bold text-danger">"{{ query }}"</span>.
          </p>

          <div class="p-3 rounded-3 text-start small mb-4 border" style="background-color: var(--card-bg-elevated);">
            <strong class="d-block mb-1"><i class="bi bi-lightbulb text-warning me-1"></i> Search Tips:</strong>
            <ul class="mb-0 ps-3 text-muted">
              <li>Enter exact or partial Roll Number (e.g. <code>IT2024001</code>)</li>
              <li>Search by full or partial student name (e.g. <code>Amaira</code>)</li>
              <li>Check for typos or extra trailing spaces</li>
            </ul>
          </div>

          <div class="d-flex flex-wrap justify-content-center gap-2">
            <a href="/" class="btn btn-home text-decoration-none d-inline-flex align-items-center gap-2">
              <i class="bi bi-house-door-fill"></i> Return to Main Dashboard
            </a>
            <button id="themeToggleBtn" onclick="toggleTheme()" class="btn btn-outline-secondary px-3 py-2 rounded-3">
              <i class="bi bi-moon-stars-fill"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
